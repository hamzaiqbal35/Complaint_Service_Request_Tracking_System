services:
  - type: web
    name: csrts-app
    env: docker
    plan: free
    envVars:
      - key: APP_NAME
        value: "Complaint Tracking System"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: "pgsql"
      - key: DB_URL
        fromDatabase:
          name: csrts-db
          property: connectionString
      # Initial Admin Seeding (Set in Render Dashboard -> Environment)
      - key: SEED_ADMIN
        sync: false # Set to 'true' to seed admin on next deploy, then 'false' afterwards
      - key: ADMIN_EMAIL
        sync: false # Default: admin@example.com (or enter your custom admin email)
      - key: ADMIN_PASSWORD
        sync: false # Default: password (or enter your custom secure password)

databases:
  - name: csrts-db
    plan: free
    databaseName: csrts
    user: csrts_user
